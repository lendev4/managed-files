[package]
name = "managed-files"
version = "0.3.0"
edition = "2024"
description = "Declarative management of mutable JSON, TOML, INI, and text files"
license = "MIT"
repository = "https://github.com/lendev4/managed-files"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.6"
toml_edit = "0.25.15"
