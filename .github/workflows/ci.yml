name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Rust formatting
        run: nix develop --command cargo fmt --check
      - name: Check Nix formatting
        run: nix fmt -- --check flake.nix nix/package.nix nix/home-manager.nix nix/tests/home-manager.nix nix/tests/noctalia.nix
      - name: Clippy
        run: nix develop --command cargo clippy --locked --all-targets -- -D warnings
      - name: Build and test package and integrations
        run: nix flake check --print-build-logs
